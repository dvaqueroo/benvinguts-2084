<!doctype html>
<html lang="ca" data-version="20261124162858">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0B0F2A" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="description" content="Benvinguts al 2084 · Joc seriós sobre NEXUS, la IA que gestiona la ciutat." />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./img/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./img/icon.svg" />
    <title>Benvinguts al 2084</title>
    <script defer src="./js/three.min.js"></script>
    <style>
      /* Mòbil a pantalla completa: l'escenari ocupa tota la pantalla i la composició 402×874
         queda centrada, amb la mateixa escala i posicions (al mode iPhone flotant no canvia res). */
      html:not(.is-device) .device,
      html:not(.is-device) .stage { width: var(--sw, 402px); height: var(--sh, 874px); }
      html:not(.is-device) .screen > *:not(.edge-glow) { translate: var(--ox, 0px) var(--oy, 0px); }
      html:not(.is-device) .screen > .decision,
      html:not(.is-device) .screen > .tutorial { right: auto; bottom: auto; width: 402px; height: 874px; }
      html:not(.is-device) .screen > .tutorial { outline: 3000px solid var(--tut-veil); }
      /* Safari iOS perd les cantonades arrodonides del vidre (backdrop-filter) si l'element o un pare
         porta translate: aquests es desplacen amb marges, que donen la mateixa posició. */
      html:not(.is-device) .screen > .glass,
      html:not(.is-device) .screen > .decision,
      html:not(.is-device) .screen > .tutorial { translate: none; margin-left: var(--ox, 0px); margin-top: var(--oy, 0px); }
      html.is-pwa, html.is-pwa body { height: var(--app-h); }
      html.is-pwa .viewport { bottom: auto; height: var(--app-h); }
    </style>
    <script>
      // iOS (web afegida a la pantalla d'inici): l'alçada que dona el navegador és més curta que la
      // pantalla (li resta la barra d'estat). En aquest mode es fa servir la mida física de la pantalla.
      (function () {
        var pwa = navigator.standalone === true || matchMedia('(display-mode: standalone)').matches;
        if (!pwa || !/iP(hone|od|ad)|Macintosh/.test(navigator.userAgent) || !('ontouchend' in document)) return;
        var d = document.documentElement;
        d.classList.add('is-pwa');
        function fit() {
          var w = Math.min(screen.width, screen.height), hh = Math.max(screen.width, screen.height);
          d.style.setProperty('--app-h', (innerWidth > innerHeight ? w : hh) + 'px');
        }
        fit();
        addEventListener('orientationchange', fit);
      })();
    </script>
    <script defer src="./js/logo-glitch.js"></script>
    <script defer src="./js/app.js"></script>
    <script>
      // Autoactualització: quan es publica una versió nova (version.txt canvia), la pàgina es recarrega.
      (function () {
        var cur = document.documentElement.dataset.version;
        function check() {
          fetch('./version.txt?t=' + Date.now(), { cache: 'no-store' })
            .then(function (r) { return r.ok ? r.text() : null; })
            .then(function (v) { if (v && cur && v.trim() !== cur) location.reload(); })
            .catch(function () {});
        }
        document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'visible') check(); });
        window.addEventListener('pageshow', check);
        setInterval(check, 30000);
      })();
    </script>
  </head>
  <body>
    <div id="viewport" class="viewport">
      <!-- iPhone flotante (tablet/desktop): marco + pantalla se mueven como una sola pieza. -->
      <div id="device" class="device">
        <div class="device-body" aria-hidden="true"></div>
        <div id="device-grip" class="device-grip" aria-hidden="true"></div>
        <main id="stage" class="stage" aria-live="polite"></main>
        <div class="device-island" aria-hidden="true"></div>
      </div>
    </div>
    
  </body>
</html>
